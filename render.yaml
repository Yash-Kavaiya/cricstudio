# Render Blueprint — CricStudio server (Fastify + Socket.IO + FFmpeg + headless Chromium).
# Render dashboard → New → Blueprint → pick this repo.
# The web app is deployed separately on Vercel (see vercel.json); this service also serves it.
services:
  - type: web
    name: cricstudio-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    # starter = always on (no sleep) + persistent disk for SQLite/uploads.
    # The 24/7 cloud producer (headless Chromium) wants ≥2 GB RAM → use "standard" for that.
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: cricstudio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8787"
      - key: DATA_DIR
        value: /data
      - key: STREAM_KEY_SECRET
        generateValue: true
      - key: MEDIA_MODE
        value: mesh
      - key: ENCODER_MODE
        value: auto
      - key: PUBLIC_URL
        sync: false # set to your Vercel URL, e.g. https://cricstudio.vercel.app
